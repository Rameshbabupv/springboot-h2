# Application Name
spring.application.name=hrms-saas

# Server Port
server.port=3020

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hrmsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Admin@123

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# ==================== Logging Configuration ====================

# Default Root Logging - Suppress all except critical errors
logging.level.root=WARN

# GraphQL Resolver Logging ONLY (Show request and response)
logging.level.com.hrms.graphql.resolver=DEBUG

# Suppress all other application layers
logging.level.com.hrms.service=WARN
logging.level.com.hrms.service.impl=WARN
logging.level.com.hrms.repository=WARN
logging.level.com.hrms.controller=WARN

# Suppress Spring Framework Logging
logging.level.org.springframework=WARN
logging.level.org.springframework.graphql=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.orm=WARN

# Suppress Hibernate/JPA Logging
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# File Logging Configuration
logging.file.name=logs/hrms-application.log
logging.file.path=logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration (Custom JWT - kept for backward compatibility)
jwt.secret=hrms-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256-algorithm-security
jwt.expiration=28800
jwt.refresh-expiration=604800

# ==================== Keycloak OAuth2 Configuration ====================

# Keycloak Server URLs
keycloak.server-url=http://localhost:8080
keycloak.realm=hrms
keycloak.client-id=hrms-backend
# Note: For production, use environment variable: export KEYCLOAK_CLIENT_SECRET=<secret>
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:2Uk4gFxSAlzhAF8KBefUND4zlFJttAyY}

# Spring Boot OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/hrms
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/hrms/protocol/openid-connect/certs

# JWT Token Lifespan (in seconds)
keycloak.token.access-token-lifespan=3600
keycloak.token.refresh-token-lifespan=604800

# User Management Configuration
user.password.expiry.days=90
user.password.history.count=5
user.failed.login.threshold=5
user.account.lock.duration.minutes=30
user.session.max.concurrent=3

