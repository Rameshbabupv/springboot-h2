supabase.key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocWVqcG9iaWhvcmNiYWJxZ3JmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NDk2Mjk4MSwiZXhwIjoyMDgwNTM4OTgxfQ.Ac5JPBJQzFJeFI91pSPV4E11gimJ3wOjNuUv542XN60
